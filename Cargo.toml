[package]
name = "obsidian-rs"
version = "0.2.0"
edition = "2021"
description = "Client Obsidian-like en Rust + iced (clean-room)"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["canvas", "svg"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
zip = "2"

[dev-dependencies]
proptest = "1"

# Binaire release compact (même recette que les clients natifs de référence) :
# LTO + un seul codegen unit + symboles retirés + pas de déroulage de pile.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
