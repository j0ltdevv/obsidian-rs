# cargo-deny : configuration minimale.
# Depuis la PR EmbarkStudios/cargo-deny#611, [advisories] n'accepte plus
# ni severity-threshold ni unmaintained : les vulnérabilités sont
# refusées par défaut, les informatives sont de simples avertissements.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Licences permissives présentes dans l'arbre des dépendances
# (BSD via aio/httparse, Zlib via miniz_oxide, NCSA via lld/rustc,
# Unicode-3.0 via icu, bzip2 via zip 9, CC0/MIT-0 via adler…).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "ISC",
    "OFL-1.1",
    "Unlicense",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "NCSA",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[advisories]
# Crates non maintenues tirées par nos dépendances (iced, serde_yaml,
# zbus) : hors de notre contrôle, aucune vulnérabilité connue au
# 24/10/2026. À retirer de la liste dès qu'une alternative est livrée
# par la dépendance qui les porte.
ignore = [
    "RUSTSEC-2024-0436", # paste (iced -> strum)
    "RUSTSEC-2026-0206", # rustybuzz (iced tiny-skia, mise en forme de police)
    "RUSTSEC-2026-0192", # ttf-parser (iced tiny-skia)
    "RUSTSEC-2024-0449", # unsafe-libyaml (serde_yaml)
    "RUSTSEC-2026-0371", # zbus_names (iced linux-theme-detection)
    "RUSTSEC-2026-0370", # zvariant (iced linux-theme-detection)
    "RUSTSEC-2026-0372", # zvariant_derive (iced linux-theme-detection)
]
